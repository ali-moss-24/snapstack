<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SnapStack | 404</title>
    <style>
        body {
            background: #f4f4f4;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 60px 20px;
            color: #333;
        }

        h1 {
            font-size: 5rem;
            margin-bottom: 10px;
            color: #e63946;
        }

        p {
            font-size: 1.3rem;
            margin-bottom: 30px;
        }

        .card {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 120px;
            height: 160px;
            border-radius: 12px;
            font-size: 2.5rem;
            color: white;
            background: #1d3557;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,2);
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #1d3557;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1rem;
            transition: background 0.3s ease;
        }
        a:hover {
            background: #274c77;
        }
    </style>
</head>
<body>
    
    <h1>404</h1>
    <div class="card">?</div>
    <p>Looks like you drew the wrong card</p>

    <a href="index.html">Back to SnapStack</a>
</body>
</html>
